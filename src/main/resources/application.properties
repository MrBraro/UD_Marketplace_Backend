
#  Application

spring.application.name=ud-marketplace-auth
server.port=8080


#  Database — MySQL

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:udmarketplacedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# ==========================================
#  Actuator Endpoints
# ==========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false


#  JWT

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000


#  2FA y seguridad

app.auth.max-intentos-fallidos=5
app.auth.minutos-bloqueo=30
app.auth.minutos-expiry-2fa=10
app.auth.minutos-expiry-token-recuperacion=60


#  Python backend — microservicios C2C-UD
app.python.mail-base-url=http://localhost:8002
app.python.mail-api-key=your-shared-internal-api-key
app.python.coupon-base-url=http://localhost:8001
app.python.report-base-url=http://localhost:8004



#  Subida de archivos

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Validación de archivos (RNF08)
app.files.max-pdf-size-bytes=5242880
app.files.max-image-size-bytes=5242880

#  CORS — orígenes permitidos
app.cors.allowed-origins=http://localhost:3000,http://localhost:8002,http://localhost:5173

#  Logging

logging.level.com.udmarketplace=DEBUG
logging.level.org.springframework.security=WARN
